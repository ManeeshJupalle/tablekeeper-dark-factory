<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Tablekeeper</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="login">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Tablekeeper</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Find a table</a>
      <a href="/lookup">Your reservation</a>
    </nav>
    <div class="auth-slot" id="auth-slot"></div>
  </div>
</header>

<main id="main" class="container narrow">
  <section class="card auth-card" aria-labelledby="login-heading">
    <p class="eyebrow">Welcome back</p>
    <h1 id="login-heading">Log in</h1>
    <p class="lede">Sign in to reserve a table or manage a booking.</p>
    <div id="auth-status"></div>
    <form id="login-form" class="stack" novalidate>
      <div class="field">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="email" data-testid="login-email" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" data-testid="login-password" required>
      </div>
      <div id="auth-messages"></div>
      <button type="submit" class="btn btn-primary btn-block" data-testid="login-submit">Log in</button>
      <p class="muted center">New to Tablekeeper? <a href="/signup">Create an account</a></p>
    </form>
  </section>
</main>

<footer class="site-footer"><div class="container">Tablekeeper · reservations for restaurants and the people who love them</div></footer>
<script src="/static/app.js"></script>
</body>
</html>
